[tool.poetry]
name = "vacancy-vault"
version = "0.1.0"
description = "Сбор вакансий с hh.ru, загрузка в PostgreSQL и запросы через DBManager"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.3"         # фикс уязвимости CVE-2024-35195
psycopg2-binary = "^2.9.9"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
requests-mock = "^1.12.1"
flake8 = "^7.1.0"
mypy = "^1.11.0"
types-requests = "^2.32.0.20240910"

[tool.poetry.scripts]
vacancy-vault = "main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
